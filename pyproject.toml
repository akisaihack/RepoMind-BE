[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repomind-backend"
version = "0.1.0"
description = "RepoMind Flask backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "Flask>=3.1,<3.2",
    "Flask-Migrate>=4.1,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "openai>=2.0,<3",
    "python-dotenv>=1.1,<2",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
